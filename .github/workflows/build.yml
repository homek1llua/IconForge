name: Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  SCHEME: IconForge

jobs:
  build:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: |
          xcodebuild -version
          swift --version

      - name: List simulators
        run: xcrun simctl list devices available | head -30

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Validate project
        run: |
          if [ ! -f "IconForge.xcodeproj/project.pbxproj" ]; then
            echo "ERROR: Xcode project was not generated"
            exit 1
          fi
          echo "Project generated successfully"

      - name: Build (Debug)
        run: |
          xcodebuild build \
            -project IconForge.xcodeproj \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee build-debug.log
          echo "Build exit code: ${PIPESTATUS[0]}"
          exit ${PIPESTATUS[0]}

      - name: Build (Release)
        run: |
          xcodebuild build \
            -project IconForge.xcodeproj \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS Simulator" \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee build-release.log
          echo "Build exit code: ${PIPESTATUS[0]}"
          exit ${PIPESTATUS[0]}

      - name: Archive IPA
        run: |
          xcodebuild archive \
            -project IconForge.xcodeproj \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -archivePath build/IconForge.xcarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

          APP_PATH=$(find build/IconForge.xcarchive/Products/Applications -name "*.app" -maxdepth 1)

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r IconForge.ipa Payload
          rm -rf Payload

          echo "IPA size: $(du -h IconForge.ipa | cut -f1)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: IconForge
          path: IconForge.ipa
          if-no-files-found: error

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-debug.log
            build-release.log
